<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - School Timetable System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="justify-content: center; align-items: center; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);">

<div class="card" style="width: 100%; max-width: 400px; padding: 40px; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 24px;">
      <i class="fa-solid fa-graduation-cap" style="font-size: 3rem; color: var(--primary);"></i>
      <h1 style="font-size: 1.5rem; font-weight: 700; margin-top: 10px;">Admin Portal</h1>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Sign in to access schedule controls</p>
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username">
    </div>

    <div class="form-group" style="margin-bottom: 24px;">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>

    <button onclick="login()" style="width: 100%; height: 44px;">
      <i class="fa-solid fa-right-to-bracket"></i> Sign In
    </button>
</div>

<script src="api.js"></script>
<script>
async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
            localStorage.setItem("user", JSON.stringify(data.user));
            window.location.href = "index.html";
        } else {
            showToast("Invalid Credentials", "error");
        }
    } catch(e) {
        showToast("Login server communication failure", "error");
    }
}
</script>

</body>
</html>
